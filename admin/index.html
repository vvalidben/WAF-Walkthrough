<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protect a site</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6573; --line: #dfe3ea;
    --accent: #2f5bea; --accent-text: #ffffff; --ok: #137a3d; --ok-bg: #e5f5ec;
    --bad: #b42318; --bad-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fff4dc;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1a1d24; --text: #e8eaef; --muted: #9aa3b2; --line: #2c313b;
      --accent: #6d8dff; --accent-text: #0d1020; --ok: #5fd08f; --ok-bg: #12301f;
      --bad: #ff8a7f; --bad-bg: #3a1714; --warn: #f2c36b; --warn-bg: #3a2c0e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 0 0 12px; font-weight: 600; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 280px; min-width: 0; padding: 11px 12px; font: inherit; color: var(--text);
                     background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 11px 16px; font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); }
  button.secondary { background: transparent; color: var(--accent); }
  button.link { border: 0; background: none; color: var(--muted); padding: 0; font-weight: 400;
                text-decoration: underline; }
  button:disabled { opacity: .6; cursor: wait; }
  .url { font-family: var(--mono); font-size: 16px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px;
           background: var(--bg); border: 1px solid var(--line); color: var(--muted); margin-left: 6px;
           vertical-align: 2px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg ul { margin: 6px 0 0; padding-left: 18px; }
  .msg button { margin-top: 8px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0;
         border-top: 1px solid var(--line); align-items: baseline; }
  .row:first-of-type { border-top: 0; }
  .row code { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .verdict { font-weight: 600; white-space: nowrap; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Protect a site</h1>
  <p class="lede">Paste your website's address. The WAF switches to it immediately, with no restart.</p>

  <section>
    <h2>Currently protecting</h2>
    <div class="url" id="current-url">…</div>
    <div class="meta" id="current-meta"></div>
    <div class="meta">Visit it through the WAF at <a href="http://localhost:8080" target="_blank" rel="noopener" id="waf-link">http://localhost:8080</a></div>
  </section>

  <section>
    <h2>New site</h2>
    <form id="protect-form">
      <input type="text" id="url" placeholder="https://your-site.com" autocomplete="off" spellcheck="false" required>
      <button type="submit" id="protect">Protect this site</button>
    </form>
    <div id="protect-msg" hidden></div>
  </section>

  <section>
    <h2>Test it</h2>
    <p class="meta" style="margin-top:0">Sends one normal request and one SQL injection through the WAF.</p>
    <button type="button" class="secondary" id="test">Run test</button>
    <div id="test-results" style="margin-top:12px" hidden></div>
  </section>

  <button type="button" class="link" id="reset">Go back to the site set in .env</button>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SOURCES = { admin: "set here", env: "from .env", default: "built-in demo backend" };

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, options);
  let data = {};
  try { data = await res.json(); } catch (e) { data = { error: "HTTP " + res.status }; }
  return { ok: res.ok, status: res.status, data };
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs || {});
  for (const child of children) node.append(child);
  return node;
}

function showTarget(t) {
  $("current-url").textContent = t.url;
  const meta = $("current-meta");
  meta.replaceChildren(
    t.host ? "Host header: " + t.host : "Host header: passed through from the visitor",
    el("span", { className: "badge", textContent: SOURCES[t.source] || t.source }),
  );
  if (t.updated_at) meta.append(el("span", { textContent: " · changed " + new Date(t.updated_at).toLocaleString() }));
  $("waf-link").href = "http://" + location.hostname + ":8080";
  $("waf-link").textContent = "http://" + location.hostname + ":8080";
}

function message(kind, text, extra) {
  const box = $("protect-msg");
  box.className = "msg " + kind;
  box.replaceChildren(text);
  if (extra) box.append(extra);
  box.hidden = false;
}

async function protect(force) {
  const button = $("protect");
  button.disabled = true;
  button.textContent = "Checking the site…";
  try {
    const { ok, data } = await api("/api/target", { url: $("url").value, force });
    if (ok) {
      showTarget(data);
      const notes = (data.notes || []).map((n) => el("li", { textContent: n }));
      message(notes.length ? "warn" : "ok",
        "Done. The WAF now protects " + data.url + (data.probe_status ? " (it answered HTTP " + data.probe_status + ")." : "."),
        notes.length ? el("ul", {}, ...notes) : null);
      $("test-results").hidden = true;
    } else if (data.can_force) {
      const again = el("button", { type: "button", className: "secondary", textContent: "Protect it anyway" });
      again.addEventListener("click", () => protect(true));
      message("bad", data.error + ". Check the address, or protect it anyway if the site is down right now.",
        el("div", {}, again));
    } else {
      message("bad", data.error || "Something went wrong.");
    }
  } catch (e) {
    message("bad", "Couldn't reach the WAF admin page: " + e.message);
  } finally {
    button.disabled = false;
    button.textContent = "Protect this site";
  }
}

function resultRow(label, value, result, good, goodText, badText) {
  const verdict = result.error
    ? el("span", { className: "verdict bad", textContent: "No answer: " + result.error })
    : el("span", { className: "verdict " + (good ? "ok" : "bad"),
                   textContent: (good ? goodText : badText) + " (HTTP " + result.status + ")" });
  return el("div", { className: "row" }, el("div", {}, label, el("br"), el("code", { textContent: value })), verdict);
}

$("protect-form").addEventListener("submit", (event) => { event.preventDefault(); protect(false); });

$("test").addEventListener("click", async () => {
  const button = $("test");
  button.disabled = true;
  button.textContent = "Testing…";
  try {
    const { ok, data } = await api("/api/test", {});
    const box = $("test-results");
    if (!ok) {
      box.replaceChildren(el("div", { className: "msg bad", textContent: data.error || "Test failed." }));
    } else {
      box.replaceChildren(
        resultRow("Normal visitor", "?q=running shoes", data.benign,
          !data.benign.error && data.benign.status !== 403, "Let through", "Blocked by mistake"),
        resultRow("SQL injection", "?id=" + data.attack_value, data.attack,
          data.attack.status === 403, "Blocked", "NOT blocked"),
      );
    }
    box.hidden = false;
  } finally {
    button.disabled = false;
    button.textContent = "Run test";
  }
});

$("reset").addEventListener("click", async () => {
  const { ok, data } = await api("/api/reset", {});
  if (ok) { showTarget(data); message("ok", "Back to the site set in .env."); }
  else message("bad", data.error || "Reset failed.");
});

api("/api/target").then(({ ok, data }) => {
  if (ok) showTarget(data);
  else $("current-url").textContent = data.error || "Couldn't load the current site.";
});
</script>
</body>
</html>
