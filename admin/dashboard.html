<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAF Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2339f29a' stroke-width='2'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard.css">
<script src="/dashboard.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#39f29a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">SQLi//WAF</span>
        <span class="brand-sub">WALKTHROUGH · LIVE</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Screens"></nav>
    <div class="status-box">
      <div class="status-mode" id="mode"><span class="dot"></span><span>…</span></div>
      <div class="kv"><span>THRESHOLD</span><span id="threshold">…</span></div>
      <div class="kv"><span>RULES ON</span><span id="rules-on">…</span></div>
      <div class="kv"><span>BANNED NOW</span><span id="bans-now">…</span></div>
      <div class="kv"><span>TARGET</span><span id="target" title="">…</span></div>
      <a class="side-link" href="/">&gt; change protected site</a>
    </div>
  </aside>
  <main class="main">
    <div class="wrap" id="screen"></div>
  </main>
</div>
</body>
</html>
