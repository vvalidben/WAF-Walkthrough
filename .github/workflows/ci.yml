name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Preprocessing parity, training + ONNX export with its fidelity gate,
      # the API, the n8n Code nodes (Node.js) and the Lua signatures (Docker).
      - name: Run pytest
        run: pytest -v

  smoke:
    name: Docker Compose smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Required by docker-compose.yml interpolation; Grafana is not started here.
      GRAFANA_ADMIN_PASSWORD: ci-unused
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install training dependencies
        run: pip install -r requirements.txt

      # The real datasets aren't in the repository: train the served model on
      # synthetic data. train.py runs the ONNX fidelity gate before writing.
      - name: Train a model on synthetic data
        run: |
          python tests/synthetic_data.py data/sqli.csv
          python train.py --data data/sqli.csv --output models/sqli_detector_optimized.pkl --n-estimators 50

      - name: Build and start WAF, ML API and backend
        run: docker compose up -d --build --wait --wait-timeout 180 openresty

      - name: Smoke test
        run: python tests/smoke.py --url http://localhost:8080 --compose-logs

      - name: Show logs
        if: failure()
        run: docker compose logs --no-color openresty ml-api

      - name: Tear down
        if: always()
        run: docker compose down -v
