# OpenResty ML WAF: every request to the backend is first scored by the SQLi
# model (waf_interceptor.lua -> ml-api /scan/batch) and blocked or proxied.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# nginx clears the environment for its workers; list what the Lua code reads.
env WAF_SCAN_URL;
env WAF_MODE;
env WAF_FAIL_MODE;
env WAF_BLOCK_THRESHOLD;
env WAF_CONNECT_TIMEOUT_MS;
env WAF_SEND_TIMEOUT_MS;
env WAF_READ_TIMEOUT_MS;
env WAF_MAX_ARGS;
env WAF_MAX_ITEMS;
env WAF_CHUNK_SIZE;
env WAF_ALERT_WEBHOOK_URL;
env WAF_ALERT_WEBHOOK_TOKEN;
env WAF_ALERT_COOLDOWN_S;
env WAF_BREAKER_SECONDS;
env WAF_EXTENDED_MODE;
env WAF_EXTENDED_THRESHOLD;
env WAF_INSPECT_HEADERS;
env WAF_MAX_HEADER_BYTES;
env WAF_MAX_COOKIES;
env WAF_CACHE_TTL_S;
env WAF_ALERT_INCLUDE_VALUES;
env WAF_REGEX_MODE;
env WAF_FAIL_OPEN_BUDGET;
env WAF_FAIL_OPEN_WINDOW_S;
env WAF_LOG_RETENTION_HOURS;
env WAF_BACKEND_URL;
env WAF_BACKEND_HOST;
env WAF_DISABLED_CATEGORIES;
env FEEDBACK_API_KEY;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Writable paths live on tmpfs so the container root can stay read-only.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Keep both equal: bodies must fit in memory to be inspected. Larger
    # bodies are refused by nginx with 413 before the WAF runs.
    client_max_body_size    1m;
    client_body_buffer_size 1m;

    # Hard cap on the request line and on each header line (incl. Cookie):
    # longer ones get 400 before the WAF runs. This bounds the memory the
    # path/header/cookie inspection can be made to use.
    large_client_header_buffers 4 8k;

    # Docker's embedded DNS, needed for cosocket and variable proxy_pass lookups.
    # Kept short: while the ml-api container is stopped, lookups of its name
    # hang until this timeout (the WAF's circuit breaker then skips it).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 500ms;

    # TLS verification for the alert webhook.
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    # Per-client rate limit, enforced before the WAF runs (preaccess phase).
    # Fail-open means a flood that saturates the ML API would switch inspection
    # off; this stops a single source from doing that. Tune to your traffic,
    # and key on a trusted client-IP header if behind a load balancer.
    limit_req_zone $binary_remote_addr zone=waf_per_ip:10m rate=50r/s;
    limit_req_status 429;

    # Brute-force protection (OWASP A07): POSTs to paths that look like a
    # login, password or token endpoint, 10 per minute per client IP with a
    # burst of 5. Everything else gets an empty key, which limit_req ignores.
    map "$request_method:$uri" $waf_login_key {
        "~*^POST:.*/(?:log-?in|sign-?in|auth(?:enticate)?|session|token|wp-login\.php|password|otp|verify)(?:\.\w+)?/?$"
            $binary_remote_addr;
        default "";
    }
    limit_req_zone $waf_login_key zone=waf_login:10m rate=10r/m;

    # Per-client-IP alert cooldowns, the ML API circuit breaker and per-client
    # fail-open budgets, shared by all workers.
    lua_shared_dict waf_alerts 1m;
    lua_shared_dict waf_state  10m;
    # Verdict cache: SHA-256(value) -> probability, LRU-evicted when full.
    lua_shared_dict waf_verdicts 10m;
    # The protected site, set from the admin page (waf_target.lua).
    lua_shared_dict waf_config 64k;

    lua_package_path "/etc/openresty/waf/?.lua;;";

    # Restore the site last chosen on the admin page (waf_config volume).
    init_by_lua_block {
        require("waf_target").load()
        require("waf_rules").load()
    }

    # Backstop for the regex pre-filter on attacker-controlled input: caps the
    # work a single ngx.re match may do. The signatures are written not to
    # backtrack, so legitimate values stay far below this; a match that hits
    # it is treated as "no match" and the value is left to the ML model.
    lua_regex_match_limit 100000;

    # One JSON line per request (escape=json: attacker-controlled values can't
    # break out of their field or forge log lines). request_uri includes the
    # query string, i.e. attack payloads but also any tokens or personal data
    # apps put in URLs: restrict access to the log store accordingly.
    # ml_probability is the model's top score; empty when a regex signature
    # decided (waf_engine=regex) or the model wasn't called. waf_category is
    # the attack type of a block/monitor decision (sqli, xss, cmdi, lfi, ...).
    log_format json_waf escape=json
        '{"timestamp":"$time_iso8601","client_ip":"$remote_addr","status":$status,'
        '"request_method":"$request_method","request_uri":"$request_uri",'
        '"user_agent":"$http_user_agent","waf_engine":"$waf_engine",'
        '"waf_signature":"$waf_signature","waf_category":"$waf_category","ml_probability":"$waf_score",'
        '"waf_action":"$waf_action","waf_reason":"$waf_reason","waf_source":"$waf_source",'
        '"request_id":"$request_id","host":"$host","path":"$uri",'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","waf_items":"$waf_items",'
        '"waf_ml_items":"$waf_ml_items","waf_latency_ms":"$waf_latency_ms",'
        '"waf_ml_request_id":"$waf_ml_request_id"}';

    # Written twice: to stdout (docker compose logs, loadtest.py --waf-log)
    # and to hourly files on the waf_logs volume, which Alloy ships to Loki.
    # A file per hour instead of one growing file: nginx can't be told to
    # reopen a rotated file from another container without Docker-socket
    # access, so old hours are deleted instead (init_worker_by_lua_block).
    map $time_iso8601 $waf_log_hour {
        "~^(?<hour>\d{4}-\d{2}-\d{2}T\d{2})" $hour;
        default                              unknown;
    }
    open_log_file_cache max=8 inactive=2m valid=1m;
    access_log /dev/stdout json_waf;
    access_log /var/log/waf/access-$waf_log_hour.log json_waf;

    # Delete hourly log files older than WAF_LOG_RETENTION_HOURS (Loki keeps
    # the history). One worker does it, every 10 minutes; times are UTC, as is
    # the container clock.
    init_worker_by_lua_block {
        if ngx.worker.id() ~= 0 then
            return
        end
        local retention = tonumber(os.getenv("WAF_LOG_RETENTION_HOURS") or "") or 24
        local function cleanup(premature)
            if premature then
                return
            end
            local now = ngx.time()
            -- Hours just past the retention window, plus 3 days of slack in
            -- case the container was stopped when they expired.
            for age = retention + 1, retention + 72 do
                os.remove(os.date("!/var/log/waf/access-%Y-%m-%dT%H.log", now - age * 3600))
            end
        end
        ngx.timer.at(0, cleanup)
        ngx.timer.every(600, cleanup)
    }

    server {
        listen 8080;
        server_name _;

        # Filled in by waf_interceptor.lua; declared here so they can be logged.
        set $waf_action        "";
        set $waf_reason        "";
        set $waf_score         "";
        set $waf_source        "";
        set $waf_engine        "";
        set $waf_signature     "";
        set $waf_category      "";
        set $waf_items         "";
        set $waf_ml_items      "";
        set $waf_latency_ms    "";
        set $waf_ml_request_id "";

        # The protected application. A variable makes nginx resolve it per
        # request, so it starts even if the backend is down and follows IP changes.
        # Set from the admin page (port 8081); otherwise WAF_BACKEND_URL in
        # .env, otherwise the placeholder. See waf_target.lua.
        set_by_lua_block $backend {
            return require("waf_target").url()
        }
        # Host header sent to the backend. A remote HTTPS site (e.g. a
        # Vercel/Netlify app) needs its own hostname here, or it routes by the
        # wrong name. Empty = pass the visitor's Host through.
        set_by_lua_block $backend_host {
            local h = require("waf_target").host()
            if h ~= "" then return h end
            return ngx.var.host
        }

        add_header X-Request-ID $request_id always;

        # Liveness probe for the proxy itself; not inspected or forwarded.
        location = /waf/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=waf_per_ip burst=100 nodelay;
            limit_req zone=waf_login burst=5 nodelay;
            access_by_lua_file /etc/openresty/waf/waf_interceptor.lua;

            # Baseline security headers (OWASP A02) wherever the app didn't set
            # its own, and no X-Powered-By advertising the backend's framework.
            header_filter_by_lua_block {
                local h = ngx.header
                if not h["X-Content-Type-Options"] then
                    h["X-Content-Type-Options"] = "nosniff"
                end
                if not h["Referrer-Policy"] then
                    h["Referrer-Policy"] = "strict-origin-when-cross-origin"
                end
                -- A CSP frame-ancestors already says who may frame the page.
                local csp = h["Content-Security-Policy"]
                if type(csp) == "table" then
                    csp = table.concat(csp, ";")
                end
                if not h["X-Frame-Options"] and not (csp and csp:find("frame-ancestors", 1, true)) then
                    h["X-Frame-Options"] = "SAMEORIGIN"
                end
                h["X-Powered-By"] = nil
            }

            proxy_pass $backend;
            proxy_http_version 1.1;
            # Send SNI for HTTPS backends (the hostname from $backend), so TLS
            # to a remote site like Vercel succeeds.
            proxy_ssl_server_name on;
            proxy_set_header Connection        "";
            proxy_set_header Host              $backend_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }

    # Admin page: paste a site's URL to put the WAF in front of it. Published
    # on 127.0.0.1 only (docker-compose.yml); waf_admin.lua also rejects
    # foreign Host and Origin headers. Not in the SIEM access log; target
    # changes are logged to the error log instead.
    server {
        listen 8081;
        server_name _;
        access_log off;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;

        location = / {
            rewrite ^ /index.html last;
        }

        location = /index.html {
            root /etc/openresty/waf/admin;
        }

        # Security dashboard. It displays attacker-controlled log data, so its
        # script is a separate file and inline script is forbidden: even a
        # value that slipped past the page's text-only rendering couldn't run.
        location = /dashboard {
            rewrite ^ /dashboard.html last;
        }

        location ~ ^/dashboard\.(?:html|js|css)$ {
            root /etc/openresty/waf/admin;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-cache always;
        }

        location /api/ {
            client_max_body_size 16k;
            content_by_lua_file /etc/openresty/waf/waf_admin.lua;
        }

        location / {
            return 404;
        }
    }
}
