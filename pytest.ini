[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
# skl2onnx warns that char analyzers "may not work"; export_onnx's fidelity
# gate is what verifies the conversion.
filterwarnings =
    ignore:The conversion of CountVectorizer may not work:UserWarning
markers =
    docker: needs a working Docker daemon (skipped otherwise)
